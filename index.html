<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="page">
        <header class="hero">
            <div class="logo">TH</div>
            <div>
                <p class="eyebrow">Полезный сервис для путешествий</p>
                <h1>Travel Helper</h1>
                <p class="subtitle">
                    Конвертируйте валюты и переводите текст в одном месте
                </p>
            </div>
        </header>

        <section class="app-card">
            <nav class="tabs">
                <button class="tab-button active" data-tab="currency">
                    <span>💱</span> Валюты
                </button>
                <button class="tab-button" data-tab="translator">
                    <span>🌐</span> Переводчик
                </button>
            </nav>

            <div id="currency" class="tab-content active">
                <div class="section-heading">
                    <p class="small-title">Калькулятор валют</p>
                    <h2>Узнайте стоимость в другой валюте</h2>
                </div>

                <div class="field">
                    <label for="amount">Сумма</label>
                    <input id="amount" type="number" min="0" step="0.01" value="100">
                </div>

                <div class="selection-row">
                    <div class="field">
                        <label for="fromCurrency">Из валюты</label>
                        <select id="fromCurrency">
                            {% for code, name in currencies.items() %}
                                <option value="{{ code }}" {% if code == "USD" %}selected{% endif %}>
                                    {{ code }} — {{ name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <button id="swapCurrencies" class="swap-button" title="Поменять валюты">
                        ⇄
                    </button>

                    <div class="field">
                        <label for="toCurrency">В валюту</label>
                        <select id="toCurrency">
                            {% for code, name in currencies.items() %}
                                <option value="{{ code }}" {% if code == "RUB" %}selected{% endif %}>
                                    {{ code }} — {{ name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button id="convertButton" class="main-button">Конвертировать</button>

                <div id="currencyResult" class="result-card">
                    <p class="result-label">Результат</p>
                    <h3>Введите сумму и нажмите кнопку</h3>
                    <p id="rateInfo"></p>
                </div>
            </div>

            <div id="translator" class="tab-content">
                <div class="section-heading">
                    <p class="small-title">Онлайн-переводчик</p>
                    <h2>Переводите текст между языками</h2>
                </div>

                <div class="language-row">
                    <select id="sourceLanguage">
                        {% for code, name in languages.items() %}
                            <option value="{{ code }}" {% if code == "auto" %}selected{% endif %}>
                                {{ name }}
                            </option>
                        {% endfor %}
                    </select>

                    <button id="swapLanguages" class="swap-button" title="Поменять языки">
                        ⇄
                    </button>

                    <select id="targetLanguage">
                        {% for code, name in languages.items() %}
                            {% if code != "auto" %}
                                <option value="{{ code }}" {% if code == "en" %}selected{% endif %}>
                                    {{ name }}
                                </option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="text-row">
                    <div class="field">
                        <label for="sourceText">Исходный текст</label>
                        <textarea id="sourceText" placeholder="Введите текст..."></textarea>
                    </div>

                    <div class="field">
                        <label for="translatedText">Перевод</label>
                        <textarea id="translatedText" readonly placeholder="Перевод появится здесь..."></textarea>
                    </div>
                </div>

                <div class="button-row">
                    <button id="clearButton" class="secondary-button">Очистить</button>
                    <button id="translateButton" class="main-button">Перевести</button>
                </div>
            </div>
        </section>

        <footer>
            Сделано на Python и Flask
        </footer>
    </main>

    <div id="notification" class="notification"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
